<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mis Reclamos')}"></head>

<body>

    <!-- Navbar Ciudadano -->
    <nav th:replace="~{fragments/layout :: nav-ciudadano('mis')}"></nav>

    <main class="main">
        <div class="container">
            <!-- Encabezado -->
            <div class="page-header">
                <h1 class="page-title">Mis Reclamos</h1>
                <div class="page-actions">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" class="form-input" placeholder="Buscar..." data-filter-table="#tablaMisReclamos">
                    </div>
                    <select class="form-select" data-status-filter>
                        <option value="">Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en proceso">En proceso</option>
                        <option value="resuelto">Resuelto</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Reclamos -->
            <div class="table-container" data-filter-scope>
                <table class="data-table" id="tablaMisReclamos">
                    <thead>
                        <tr>
                            <th>N° Expediente</th>
                            <th>Fecha</th>
                            <th>Asunto</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reclamo : ${reclamos}" 
                            th:data-status="${reclamo.estado.nombreEstado?.toLowerCase()}">
                            <td>
                                <strong th:text="${reclamo.codigoSeguimiento}">EXP-2026-001</strong>
                            </td>
                            <td th:text="${#temporals.format(reclamo.fechaRegistro, 'dd/MM/yyyy')}">29/09/2026</td>
                            <td th:text="${reclamo.asunto}">Solicitud de licencia</td>
                            <td th:text="${reclamo.categoria.nombreCategoria}">Reclamo</td>
                            <td>
                                <span class="badge badge--warning" 
                                      th:classappend="${reclamo.estado.nombreEstado == 'Resuelto'} ? 'badge--success' : (${reclamo.estado.nombreEstado == 'En proceso'} ? 'badge--primary' : 'badge--warning')"
                                      th:text="${reclamo.estado.nombreEstado}">Pendiente</span>
                            </td>
                            <td>
                                <a th:href="@{/reclamos/detalle/{id}(id=${reclamo.idReclamo})}" 
                                   class="btn-icon" title="Ver detalle">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reclamos)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                No tienes reclamos registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
