<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ============ HEAD ============ -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Muni Gestión</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<!-- ============ NAVBAR CIUDADANO ============ -->
<nav th:fragment="nav-ciudadano(activo)" class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #C8102E 0%, #9B0A20 100%);">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Mesa de Partes Virtual</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCiu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navCiu">
            <ul class="navbar-nav ms-auto gap-2 align-items-center">
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'nuevo'} ? 'active fw-bold'" th:href="@{/reclamos/nuevo}">Nuevo Reclamo</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'mis'} ? 'active fw-bold'" th:href="@{/reclamos/mis-reclamos}">Mis Reclamos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Salir</a></li>
                <!-- Mostrar nombre del usuario si está logueado -->
                <li class="nav-item" th:if="${usuario != null}">
                    <span class="nav-link" style="background: rgba(255,255,255,0.15); border-radius: 20px; padding: 0.4rem 1rem; font-weight: 500; font-size: 0.9rem;">
                        <i class="fas fa-user me-1"></i>
                        <span th:text="${usuario.nombre + ' ' + usuario.apellidos}">Usuario</span>
                    </span>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============ NAVBAR ADMIN ============ -->
<nav th:fragment="nav-admin(activo)" class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #C8102E 0%, #9B0A20 100%);">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/reclamos/bandeja}">Panel de Gestión</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navAdm">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navAdm">
            <ul class="navbar-nav ms-auto gap-2 align-items-center">
                <!-- Siempre visible -->
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'bandeja'} ? 'active fw-bold'" th:href="@{/reclamos/bandeja}">Bandeja</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'estadisticas'} ? 'active fw-bold'" th:href="@{/admin/estadisticas}">Estadísticas</a></li>
                
                <!-- Solo para Administradores -->
                <li class="nav-item" th:if="${usuario != null and 'Administrador'.equalsIgnoreCase(usuario.rol.nombreRol)}">
                    <a class="nav-link" th:classappend="${activo == 'usuarios'} ? 'active fw-bold'" th:href="@{/usuarios/lista}">Usuarios</a>
                </li>
                <li class="nav-item" th:if="${usuario != null and 'Administrador'.equalsIgnoreCase(usuario.rol.nombreRol)}">
                    <a class="nav-link" th:classappend="${activo == 'catalogos'} ? 'active fw-bold'" th:href="@{/admin/catalogos}">Catálogos</a>
                </li>
                
                <!-- Nombre del usuario -->
                <li class="nav-item" th:if="${usuario != null}">
                    <span class="nav-link" style="background: rgba(255,255,255,0.15); border-radius: 20px; padding: 0.4rem 1rem; font-weight: 500; font-size: 0.9rem;">
                        <i class="fas fa-user-shield me-1"></i>
                        <span th:text="${usuario.nombre + ' ' + usuario.apellidos}">Usuario</span>
                    </span>
                </li>
                
                <!-- Botón Salir -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Salir</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============ FOOTER ============ -->
<footer th:fragment="footer" class="bg-light text-center py-3 mt-5 border-top">
    <p class="mb-0 text-muted">2026 - Municipalidad Provincial de Arequipa</p>
</footer>

<!-- ============ SCRIPTS ============ -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/app.js}" defer></script>
</div>

</html>
